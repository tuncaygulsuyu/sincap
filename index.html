<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuncay & Özge Masalı</title>
    <style>
        :root {
            --primary: #ff5277;
            --bg: #f4f6f8;
            --card: #ffffff;
            --text: #2d3436;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; max-height: 800px; background: #fff; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; position: relative; }
        header { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 20px; margin-bottom: 4px; }
        header p { font-size: 12px; opacity: 0.9; }
        .content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card h3 { font-size: 14px; color: var(--primary); margin-bottom: 8px; }
        input, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; }
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        ul { list-style: none; margin-top: 8px; max-height: 120px; overflow-y: auto; }
        li { background: #f9f9f9; padding: 8px; margin-bottom: 4px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-bar { font-size: 10px; text-align: center; padding: 6px; background: #eef2f5; color: #636e72; }
    </style>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCi3RVc9AvcI-1ZH9uRWBtFsmW2GuSdMvI",
            authDomain: "sincap-v2.firebaseapp.com",
            projectId: "sincap-v2",
            storageBucket: "sincap-v2.firebasestorage.app",
            messagingSenderId: "985716748362",
            appId: "1:985716748362:web:980a879cab98c40afdf6b3",
            measurementId: "G-PF628J6GDF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const stateRef = doc(db, "sincap_data", "main_state");

        // Varsayılan Ortak Durum (State)
        let appState = {
            todos: [],
            songs: [],
            lastUpdate: ""
        };

        // Buluttan Canlı Dinleme (Real-time Sync)
        onSnapshot(stateRef, (docSnap) => {
            if (docSnap.exists()) {
                appState = docSnap.data();
                document.getElementById("sync-status").textContent = "🟢 Buluta Bağlı & Senkronize";
                renderUI();
            } else {
                // İlk kurulum
                syncToCloud();
            }
        });

        // Buluta Veri Yazma Fonksiyonu
        window.syncToCloud = async function() {
            try {
                appState.lastUpdate = new Date().toLocaleTimeString();
                await setDoc(stateRef, appState);
            } catch (e) {
                console.error("Yazma hatası:", e);
                document.getElementById("sync-status").textContent = "🔴 Senkronizasyon Hatası!";
            }
        };

        // Arayüzü Güncelleme
        function renderUI() {
            // Yapılacaklar
            const todoListEl = document.getElementById("todo-list");
            todoListEl.innerHTML = "";
            (appState.todos || []).forEach((item, index) => {
                let li = document.createElement("li");
                li.innerHTML = `${item} <button onclick="removeItem('todos', ${index})" style="width:auto; padding:2px 6px; font-size:10px;">Sil</button>`;
                todoListEl.appendChild(li);
            });

            // Şarkılar
            const songListEl = document.getElementById("song-list");
            songListEl.innerHTML = "";
            (appState.songs || []).forEach((item, index) => {
                let li = document.createElement("li");
                li.innerHTML = `${item} <button onclick="removeItem('songs', ${index})" style="width:auto; padding:2px 6px; font-size:10px;">Sil</button>`;
                songListEl.appendChild(li);
            });
        }

        // Öğe Ekleme
        window.addItem = function(type) {
            const inputEl = document.getElementById(type + "-input");
            const val = inputEl.value.trim();
            if(!val) return;
            
            if(!appState[type]) appState[type] = [];
            appState[type].push(val);
            inputEl.value = "";
            
            syncToCloud();
        };

        // Öğe Silme
        window.removeItem = function(type, index) {
            appState[type].splice(index, 1);
            syncToCloud();
        };
    </script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Tuncay & Özge</h1>
            <p>Bulut Senkronize Ortak Alan</p>
        </header>

        <div id="sync-status" class="status-bar">Bağlanıyor...</div>

        <div class="content">
            <!-- Yapılacaklar Kartı -->
            <div class="card">
                <h3>Ortak Yapılacaklar</h3>
                <input type="text" id="todos-input" placeholder="Yeni görev yaz...">
                <button onclick="addItem('todos')">Ekle</button>
                <ul id="todo-list"></ul>
            </div>

            <!-- Şarkılar Kartı -->
            <div class="card">
                <h3>Ortak Şarkılarımız</h3>
                <input type="text" id="songs-input" placeholder="Şarkı adı yaz...">
                <button onclick="addItem('songs')">Ekle</button>
                <ul id="song-list"></ul>
            </div>
        </div>
    </div>

</body>
</html>
